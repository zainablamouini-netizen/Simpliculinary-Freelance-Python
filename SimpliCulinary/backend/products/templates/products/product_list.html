<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Produits</title>
</head>

<body>
    <h1>Nos Produits</h1>
    <table border="1">
        <tr>
            <th>Nom</th>
            <th>Marque</th>
            <th>Catégorie</th>
            <th>Stock</th>
        </tr>
        {% for product in produits %}
        <tr>
            <td>{{ product.nom }}</td>
            <td>{{ product.marque }}</td>
            <td>{{ product.categorie }}</td>
            <td>{{ product.stock }}</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
