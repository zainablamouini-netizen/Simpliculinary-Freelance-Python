<!DOCTYPE html>
<html>
<head>
    <title>Invoices</title>
</head>
<body>
    <h1>Invoices</h1>
    <a href="{% url 'billing:invoice_create' %}">Create Invoice</a>
    <table>
        <thead>
            <tr>
                <th>Number</th>
                <th>Client</th>
                <th>Date</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for invoice in invoices %}
            <tr>
                <td>{{ invoice.invoice_number }}</td>
                <td>{{ invoice.client.name }}</td>
                <td>{{ invoice.date }}</td>
                <td>{{ invoice.total }}</td>
                <td>{{ invoice.status }}</td>
                <td><a href="{% url 'billing:invoice_pdf' invoice.pk %}">PDF</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
